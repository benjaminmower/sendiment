name = "sendiment-mcp"
main = "server.js"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

# Call the river worker directly. A plain fetch() to its workers.dev URL
# from another worker on the same account returns a non-JSON 404 (error 1042).
[[services]]
binding = "RIVER"
service = "sendiment"
