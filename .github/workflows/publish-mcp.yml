# Publishes mcp/server.json to the official MCP Registry
# (registry.modelcontextprotocol.io) whenever it changes on main.
#
# Auth is GitHub OIDC: no secrets, and the namespace is derived from the
# repo owner, so this lands as io.github.benjaminmower/sendiment.
# The registry refuses duplicate versions, so bump "version" in
# server.json to republish.
name: Publish to MCP Registry

on:
  push:
    branches: [main]
    paths: ["mcp/server.json"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v5

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Validate server.json
        run: ./mcp-publisher validate

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish
        run: ./mcp-publisher publish
